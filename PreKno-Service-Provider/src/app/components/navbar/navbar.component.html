<span class="{{ activeTheme }}">
    <mat-toolbar color="primary" class="navbar">
        <div class="logo example-spacer flex-row">
            <button
                *ngIf="isLoggedIn"
                mat-icon-button
                class="menu-button"
                (click)="toggleSidenav()">
                <mat-icon>menu</mat-icon>
            </button>

            <a routerLink="/home">
                <img src="../../../assets/image/logo.png" class="logo" />
            </a>
        </div>
    </mat-toolbar>

    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav #sidenav mode="over" [opened]="showSidenav">
            <mat-nav-list>
                <a
                    mat-list-item
                    routerLink="{{ route.key }}"
                    routerLinkActive="active-link"
                    *ngFor="let route of routes | keyvalue"
                    >{{ route.value }}</a
                >
            </mat-nav-list>

            <button mat-flat-button class="logout-button" (click)="logout()">
                Logout
            </button>
        </mat-sidenav>

        <mat-sidenav-content>
            <router-outlet></router-outlet>
        </mat-sidenav-content>
    </mat-sidenav-container>
</span>
