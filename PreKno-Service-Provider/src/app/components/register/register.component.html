<div class="flex-column margin-top-30 container form-shadow" [formGroup]="registrationForm">
    <div class="flex-1">
        <h1 class="margin-bottom-25 margin-top-10">Create a Service Provider Account</h1>
    </div>

    <div class="flex-row" style="  justify-content: center;
    align-items: center;" >
        <mat-form-field class="form-field flex-1" appearance="outline">
            <mat-label>First Name</mat-label>
            <input type="text" matInput formControlName="firstName" required >
            <mat-error *ngIf="registrationForm.controls['firstName'].hasError('required')">First name is required.</mat-error>
        </mat-form-field>

        <mat-form-field class="form-field flex-1 ml-20" appearance="outline">
            <mat-label>Last Name</mat-label>
            <input type="text" matInput formControlName="lastName" required>
            <mat-error *ngIf="registrationForm.controls['lastName'].hasError('required')">Last name is required.</mat-error>
        </mat-form-field>
    </div>

    <div class="flex-row">
        <mat-form-field class="flex-1 form-field" appearance="outline">
            <mat-label>Email</mat-label>
            <input type="text" matInput formControlName="email" required>
            <mat-error *ngIf="registrationForm.controls['email'].hasError('required')">Email is required.</mat-error>
            <mat-error *ngIf="registrationForm.controls['email'].hasError('pattern')">Invalid Email Format</mat-error>
            <mat-error *ngIf="registrationForm.controls['email'].hasError('email')">Invalid Email Format</mat-error>
        </mat-form-field>

        <mat-form-field class="flex-1 form-field ml-20" appearance="outline">
            <mat-label>City</mat-label>
            <input type="text" matInput formControlName="city" required>
            <mat-error *ngIf="registrationForm.controls['city'].hasError('required')">City is required.</mat-error>
        </mat-form-field>
    </div>

    <mat-form-field class="flex-1 form-field" appearance="outline">
        <mat-label>State</mat-label>
        <mat-select (change)="selectState($event)" formControlName="state">
            <mat-option *ngFor="let state of states" [value]="state">{{state}}</mat-option>
        </mat-select>
        <mat-error *ngIf="registrationForm.controls['state'].hasError('required')">State is required.</mat-error>
    </mat-form-field>

    <button class="flex-1 submit-button" mat-raised-button color="primary" (click)="onSubmit()">Submit</button>
</div>
