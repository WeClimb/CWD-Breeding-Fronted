<span class="{{ activeTheme }}">
    <mat-toolbar color="primary" class="navbar">
        <div class="logo example-spacer flex-row">
            <button
                mat-icon-button
                class="menu-button"
                (click)="toggleSidenav()">
                <mat-icon>menu</mat-icon>
            </button>
            <a style="margin: 0 auto;" *ngIf="!isAdmin" routerLink="/home">
                <img src="../../../assets/image/CWDbreeding-Logo-Orange.png" class="logo" />
            </a>
            <a style="margin: 0 auto;" *ngIf="isAdmin" routerLink="/admin-home">
                <img src="../../../assets/image/CWDbreeding-Logo-Orange.png" class="logo" />
            </a>

        </div>
    </mat-toolbar>

    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav #sidenav mode="over" [opened]="showSidenav">
            <mat-nav-list>
                <a *ngIf="!isAdmin" (click)="sidenav.close()" mat-list-item routerLink="/home">Home</a>
                <a *ngIf="isAdmin" (click)="sidenav.close()" mat-list-item routerLink="/admin-home">Home</a>

                <a *ngIf="isLoggedIn" (click)="logout()" mat-list-item>Logout</a>
                <a *ngIf="!isLoggedIn" (click)="sidenav.close()" mat-list-item routerLink="/login">Login</a>
            </mat-nav-list>
        </mat-sidenav>

        <mat-sidenav-content>
            <router-outlet></router-outlet>
            <app-footer></app-footer>
        </mat-sidenav-content>
    </mat-sidenav-container>
</span>
