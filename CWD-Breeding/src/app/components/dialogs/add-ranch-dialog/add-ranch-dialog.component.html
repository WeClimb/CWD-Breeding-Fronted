<div class="container">
  <mat-card class="card">
    <mat-card-title>Add Ranch</mat-card-title>
    <mat-card-content>
      <form [formGroup]="ranchForm" (submit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Ranch Name</mat-label>
          <input matInput formControlName="name" placeholder="Ranch Name">
        </mat-form-field>

        <div class="flex-container">
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Owner First Name</mat-label>
              <input matInput formControlName="ownerFirstName" placeholder="Owner First Name">
            </mat-form-field>
          </div>

          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Owner Last Name</mat-label>
              <input matInput formControlName="ownerLastName" placeholder="Owner Last Name">
            </mat-form-field>
          </div>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Website</mat-label>
          <input matInput formControlName="website" placeholder="Website">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="Email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" placeholder="Address">
        </mat-form-field>

        <div class="flex-container">
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>City</mat-label>
              <input matInput formControlName="city" placeholder="City">
            </mat-form-field>
          </div>
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>State</mat-label>
              <mat-select (change)="selectState($event)" formControlName="state">
                  <mat-option *ngFor="let state of states" [value]="state">{{state}}</mat-option>
              </mat-select>
              <mat-error *ngIf="ranchForm.controls['state'].hasError('required')">State is required.</mat-error>
          </mat-form-field>
          </div>
        </div>

        <div class="flex-container">
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Zipcode</mat-label>
              <input matInput formControlName="zipcode" placeholder="Zipcode" maxlength="5" DigitOnly>
            </mat-form-field>
          </div>

          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Phone Number</mat-label>
              <input matInput formControlName="phoneNumber" placeholder="Phone Number" appPhoneMask>
            </mat-form-field>
          </div>
        </div>

        <button class="save-btn" mat-raised-button color="accent" type="submit" [disabled]="loading || ranchForm.invalid">
          <span *ngIf="!loading">Save</span>
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        </button>      
      </form>
    </mat-card-content>
  </mat-card>
</div>
