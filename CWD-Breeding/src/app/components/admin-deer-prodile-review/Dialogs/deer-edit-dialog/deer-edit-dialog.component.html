<form [formGroup]="registrationForm" class="flex-column">
  <mat-form-field class="form-field flex-1" appearance="outline">
      <mat-label>Deer Name</mat-label>
      <input type="text" matInput formControlName="name" required >
      <mat-error *ngIf="registrationForm.controls['name'].hasError('required')">Deer name is required.</mat-error>
  </mat-form-field>

  <mat-form-field class="form-field flex-1" appearance="outline">
      <mat-label>NADR</mat-label>
      <input type="text" matInput formControlName="nadr" required >
      <mat-error *ngIf="registrationForm.controls['nadr'].hasError('required')">NADR is required.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field flex-1">
      <mat-label>Date of Birth</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="dob" required>
      <mat-error *ngIf="registrationForm.controls['dob'].hasError('required')">DOB is required.</mat-error>
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

  <mat-form-field class="flex-1 form-field" appearance="outline">
      <mat-label>Codon</mat-label>
      <input type="text" matInput formControlName="codon" required>
      <mat-error *ngIf="registrationForm.controls['codon'].hasError('required')">Codon is required.</mat-error>
  </mat-form-field>

  <mat-form-field class="flex-1 form-field" appearance="outline">
      <mat-label>GEBV</mat-label>
      <input type="text" matInput formControlName="gebu" required>
      <mat-error *ngIf="registrationForm.controls['gebu'].hasError('required')">GEBV is required.</mat-error>
  </mat-form-field>

  <mat-form-field class="flex-1 form-field" appearance="outline">
    <mat-label>Video Link</mat-label>
    <input type="text" matInput formControlName="videoLink" required>
</mat-form-field>

  <mat-form-field class="form-field flex-1" appearance="outline">
      <mat-label>SCI Score</mat-label>
      <input matInput formControlName="sciScore" required type="number" [roundingValue]="3" appDecimalPlaces>
      <mat-error *ngIf="registrationForm.controls['sciScore'].hasError('required')">SCI Score is required.</mat-error>
  </mat-form-field>

  <mat-checkbox class="form-field" formControlName="semenAvailable">Semen Available?</mat-checkbox>


  <mat-form-field *ngIf="registrationForm.controls['semenAvailable'].value" class="flex-1 form-field" appearance="outline">
      <mat-label>Semen Cost</mat-label>
      <input matInput formControlName="semenCost" required type="number" [roundingValue]="2" appDecimalPlaces>
      <mat-error *ngIf="registrationForm.controls['semenCost'].hasError('required')">Address is required.</mat-error>
  </mat-form-field>

  <mat-form-field class="flex-1 form-field" appearance="outline">
    <mat-label>Description</mat-label>
    <textarea rows="8" matInput formControlName="description"></textarea>
</mat-form-field>

</form>

<button class="admin-btn" mat-raised-button color="accent" (click)="acceptChanges()" >Accept</button>

<mat-progress-bar *ngIf="loading" color="accent" style="margin-top: 20px;" mode="indeterminate"></mat-progress-bar>
