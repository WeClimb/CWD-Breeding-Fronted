<div class="background">
  <div class="container">
      <div>
        <form [formGroup]="ranchSearchForm" class="form-container">
          <h2>Search Ranches</h2>

          <mat-form-field appearance="fill">
            <mat-label>Ranch Name</mat-label>
            <input matInput formControlName="name" placeholder="Ranch Name">
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Owner First Name</mat-label>
            <input matInput formControlName="ownerFirstName" placeholder="Owner First Name">
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Owner Last Name</mat-label>
            <input matInput formControlName="ownerLastName" placeholder="Owner Last Name">
          </mat-form-field>
        </form>
        
        <table mat-table [dataSource]="ranches" class="ranches-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Ranch Name</th>
            <td mat-cell *matCellDef="let ranch">{{ ranch.name }}</td>
          </ng-container>
          <ng-container matColumnDef="ownerFirstName">
            <th mat-header-cell *matHeaderCellDef>Owner First Name</th>
            <td mat-cell *matCellDef="let ranch">{{ ranch.ownerFirstName }}</td>
          </ng-container>
          <ng-container matColumnDef="ownerLastName">
            <th mat-header-cell *matHeaderCellDef>Owner Last Name</th>
            <td mat-cell *matCellDef="let ranch">{{ ranch.ownerlastName }}</td>
          </ng-container>
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let ranch">
              <button color="accent" mat-icon-button (click)="selectRanch(ranch)">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="['name', 'ownerFirstName', 'ownerLastName', 'select']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['name', 'ownerFirstName', 'ownerLastName', 'select']"></tr>
        </table>
        
        <div *ngIf="ranches?.length === 0" class="no-results">
          No ranches found.
        </div>
    </div>

    <div class="action-container">
      <mat-card class="admin-panel-card">
        <mat-card-title>Add Ranch</mat-card-title>
        <mat-divider inset></mat-divider>
        <mat-card-actions>
          <button class="action-btn" mat-raised-button color="accent" (click)="openAddRanchDialog()">ADD</button>
        </mat-card-actions>
      </mat-card>

      <mat-card class="admin-panel-card">
        <mat-card-title>Pending Deer Listings: <span class="request-count">{{pendingDeer.length}}</span></mat-card-title>
        <mat-divider inset></mat-divider>
        <mat-card-actions>
          <button class="action-btn" mat-raised-button color="accent" (click)="navToPendingReviews()">VIEW</button>
        </mat-card-actions>
      </mat-card>
    </div>

  </div>
</div>
