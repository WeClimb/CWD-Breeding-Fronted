<div class="container">
  <mat-card class="card">
    <div class="profile-header">
      <div class="profile-image-container">
        <img class="profile-image" src="../../../assets/image/CWDbreeding-Logo-Orange.png" alt="Profile Image">
      </div>
      <div class="profile-details">
        <div class="ranch-name">{{selectedRanch?.name}}</div>
        <div class="owner-name">{{selectedRanch?.ownerFirstName}} {{selectedRanch?.ownerlastName}}</div>
      </div>
    </div>

    <mat-card-content>
      <form [formGroup]="ranchForm" (submit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Ranch Name</mat-label>
          <input matInput formControlName="name" placeholder="Ranch Name">
        </mat-form-field>

        <div class="flex-container">
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Owner First Name</mat-label>
              <input matInput formControlName="ownerFirstName" placeholder="Owner First Name">
            </mat-form-field>
          </div>

          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Owner Last Name</mat-label>
              <input matInput formControlName="ownerlastName" placeholder="Owner Last Name">
            </mat-form-field>
          </div>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Website</mat-label>
          <input matInput formControlName="website" placeholder="Website">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="Email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address" placeholder="Address">
        </mat-form-field>

        <div class="flex-container">
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>City</mat-label>
              <input matInput formControlName="city" placeholder="City">
            </mat-form-field>
          </div>
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>State</mat-label>
              <mat-select (change)="selectState($event)" formControlName="state">
                  <mat-option *ngFor="let state of states" [value]="state">{{state}}</mat-option>
              </mat-select>
          </mat-form-field>
          </div>
        </div>

        <div class="flex-container">
          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Zipcode</mat-label>
              <input matInput formControlName="zipcode" placeholder="Zipcode" maxlength="5" DigitOnly>
            </mat-form-field>
          </div>

          <div class="half-width">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Phone Number</mat-label>
              <input matInput formControlName="phoneNumber" placeholder="Phone Number" appPhoneMask>
            </mat-form-field>
          </div>z
        </div>

        <button class="save-btn" mat-raised-button color="accent" type="submit" [disabled]="loading || ranchForm.invalid">
          <span *ngIf="!loading">Save</span>
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        </button>      
      </form>
    </mat-card-content>
  </mat-card>
</div>

<div class="add-deer-button">
  <button mat-raised-button color="accent" (click)="navigateToAddDeer()">Add Deer</button>
</div>

<div class="deer-card-container">

  <div *ngFor="let deer of deer" class="deer-card">
    <mat-card class="example-card">
      <mat-card-header>
        <mat-card-title style="color: orange;">{{deer.name}}</mat-card-title>
        <mat-card-subtitle>{{deer.ranch?.name}}</mat-card-subtitle>
      </mat-card-header>
      <mat-divider inset></mat-divider>
      <img class="card-img" mat-card-image [lazyLoad]="deer.profileImage" alt="Loading Deer Image....">
      <mat-divider style="margin-bottom: 5px;" inset></mat-divider>
      <mat-card-content class="card-content">
        <div>NADR: {{deer.nadr}}</div>
        <div>GEBV: {{deer.gebu}}</div>
        <div>Codon: {{deer.codon}}</div>
      </mat-card-content>
      <mat-card-actions class="card-btn">
        <button color="accent" (click)="editDeerProfile(deer.id)" mat-raised-button>Edit Deer</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
